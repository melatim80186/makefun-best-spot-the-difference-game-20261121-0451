<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Scenes — Spot the Difference</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand">
      <span class="logo">🔍</span>
      <div>
        <div class="brand-name">TWIN SCENES</div>
        <div class="brand-sub">Spot the Difference</div>
      </div>
    </div>
    <div class="level-box">
      <div id="level-name">Level 1 — The Detective's Study</div>
      <div id="level-tag">Warm-up · A quiet room, a sleeping cat, seven small lies.</div>
      <div id="level-dots" aria-label="Level progress"></div>
    </div>
    <div class="stat">
      <div class="stat-label">FOUND</div>
      <div class="stat-value" id="found-count">0 / 7 found</div>
    </div>
    <div class="stat timer-stat">
      <div class="stat-label">TIME</div>
      <div class="stat-value" id="timer">2:30</div>
      <div class="timer-bar"><div id="timer-fill"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">HINTS</div>
      <div class="stat-value" id="hints">💡 3</div>
    </div>
  </header>

  <main id="stage">
    <canvas id="game" width="1180" height="460" aria-label="Spot the difference: two near-identical pictures side by side. Click a difference on either picture to ring it."></canvas>
    <div id="overlay"></div>
    <div id="toast" role="status"></div>
  </main>

  <footer id="controls">
    <button id="btn-hint" title="Hint (H) — costs 50 points">💡 Hint <kbd>H</kbd></button>
    <button id="btn-restart-level" title="Restart this level (R)">↻ Restart level <kbd>R</kbd></button>
    <button id="btn-sound" title="Toggle sound (M)">🔊 Sound on</button>
    <span class="hint-text">Click a difference on <b>either</b> picture · wrong clicks cost 25 points · find all 7 to clear the level</span>
  </footer>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
